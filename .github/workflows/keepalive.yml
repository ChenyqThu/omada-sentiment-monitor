name: Keepalive

on:
  schedule:
    # Check weekly; push an empty commit only if no commits in >= 40 days
    # (leaves >= 20 days headroom before GitHub's 60-day inactivity disable)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Push keepalive commit if inactive >= 40 days
        run: |
          last_commit_ts=$(git log -1 --format=%ct)
          now_ts=$(date +%s)
          days_since=$(( (now_ts - last_commit_ts) / 86400 ))
          echo "Days since last commit: ${days_since}"

          if [ "${days_since}" -lt 40 ]; then
            echo "Repository is active (< 40 days); skipping keepalive commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows alive"
          git push
